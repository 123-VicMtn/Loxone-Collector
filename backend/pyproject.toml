[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "loxone-collector"
version = "0.1.0"
description = "Collecte des Miniservers Loxone, API JSON et décompte de charges"
requires-python = ">=3.9"
# Mêmes versions que requirements.txt et requirements-websocket.txt.
dependencies = [
    "Flask==3.0.3",
    "Flask-Login==0.6.3",
    "requests==2.32.3",
    "PyYAML==6.0.2",
    "python-dotenv==1.0.1",
    "openpyxl==3.1.5",
    "waitress==3.0.2",
    "tzdata==2026.6",
]

[project.optional-dependencies]
# Plus `pip install --no-deps pyloxone-api==0.2.4` : sa contrainte
# websockets<10 ne marche pas en Python 3.12 (voir requirements-websocket.txt).
websocket = ["httpx==0.19.0", "pycryptodome==3.23.0", "websockets==13.1"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
extend-exclude = ["src/loxone_collector.egg-info"]

[tool.ruff.lint]
# Erreurs réelles (F), style de base (E, W), imports triés (I). Pas la
# longueur de ligne : le code est écrit à ~100 colonnes, un reformatage
# n'apporterait rien. Les affectations groupées (`a = 1; b = 2`) des tests
# et des scripts d'audit, et les `l` de boucle, sont voulus.
select = ["E", "F", "W", "I"]
ignore = ["E501", "E702", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["loxone_collector", "site_reference"]
